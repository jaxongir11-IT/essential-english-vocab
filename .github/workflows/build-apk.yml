name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/EssentialEnglishVocab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EssentialEnglishVocab-APK
          path: dist-apk/EssentialEnglishVocab.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Essential English Vocab Pro v1.0.4 (Offline Bundled Assets & Persistent Auto-Login)"
          body: |
            ## 📱 Essential English Vocab Mastery — Android APK (v1.0.4)

            - 🚀 **100% Ichki Offline Resurslar (Bundled Assets):** Barcha web sahifalar, 3D logotiplar va 4000 ta so'zlar bazasi to'g'ridan-to'g'ri APK ichiga joylandi (`file:///android_asset/`). Endi tashqi Vercel serveriga yoki internet keshiga bog'liq emas, 0 soniyada bir zumda ochiladi!
            - 👤 **Shaxsiy Akkaunt & Ro'yxatdan O'tish:** Birinchi marta kirganda toza Ro'yxatdan o'tish yoki Kirish oynasi chiqadi. Akkauntga kirilgach, u telefonda doimiy saqlanadi va qaytib hech qachon login so'ramaydi!
            - 🌌 **Asl Cyber Blue Dizayn:** Barcha ekranlar, kartochkalar va tugmalar yuqori kontrastli va yorqin rangda to'liq tiklandi (qorong'uda qora bo'lib qolmaydi).
            - 🎨 **3D Glowing App Icon & Launcher**

            Yuklab olish: [EssentialEnglishVocab.apk](https://github.com/jaxongir11-IT/essential-english-vocab/releases/download/v1.0.4/EssentialEnglishVocab.apk)
          draft: false
          prerelease: false
          files: dist-apk/EssentialEnglishVocab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
