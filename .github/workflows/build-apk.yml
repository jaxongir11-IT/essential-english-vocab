name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/EssentialEnglishVocab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EssentialEnglishVocab-APK
          path: dist-apk/EssentialEnglishVocab.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Essential English Vocab Pro v1.0.3 (Personal Accounts & Registration System)"
          body: |
            ## 📱 Essential English Vocab Mastery — Android APK (v1.0.3)

            - 👤 **Shaxsiy Akkaunt & Ro'yxatdan O'tish:** Har bir foydalanuvchi o'z ismi, logini, avatari va ixtiyoriy 4 xonali PIN kodi bilan shaxsiy profil ochishi mumkin!
            - 📊 **Alohida Natijalar:** Har bir o'quvchining o'z shaxsiy XP ballari, darajasi (Level 1-100), o'rgangan so'zlari va xotira takrorlash (SM-2) jadvali mustaqil saqlanadi.
            - 👥 **Qurilmadagi Akkauntlar:** Bitta telefonda bir nechta talaba akkauntlarini saqlab, bir bosishda almashtirib dars qilish imkoniyati.
            - 🎨 **Ultra Cyber Blue Dizayn:** To'liq tiniq, kontrastli va zamonaviy 3D logotipli interfeys.

            Yuklab olish: [EssentialEnglishVocab.apk](https://github.com/jaxongir11-IT/essential-english-vocab/releases/download/v1.0.3/EssentialEnglishVocab.apk)
          draft: false
          prerelease: false
          files: dist-apk/EssentialEnglishVocab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
