name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/EssentialEnglishVocab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EssentialEnglishVocab-APK
          path: dist-apk/EssentialEnglishVocab.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "Essential English Vocab Pro v1.0.2 (Direct Dashboard Launch & High Contrast Blue Theme)"
          body: |
            ## 📱 Essential English Vocab Mastery — Android APK (v1.0.2)

            - 🚀 Ilovaga kirishda login oynasi chiqib to'sib qolishi to'liq olib tashlandi: dastur to'g'ridan-to'g'ri Asosiy Dashboard sahifasida ochiladi!
            - 🌌 Yuqori kontrastli va chiroyli Cyber Blue mavzusi faollashtirildi (qorong'uda qora bo'lib qolmaydi).
            - 🎨 Yangi 3D Glowing App Icon & Launcher logotipi o'rnatilgan.
            - 📸 AI Kamera & Lug'at Daftari Skaneri (Auto Flashcard & Auto Unit).

            Yuklab olish: [EssentialEnglishVocab.apk](https://github.com/jaxongir11-IT/essential-english-vocab/releases/download/v1.0.2/EssentialEnglishVocab.apk)
          draft: false
          prerelease: false
          files: dist-apk/EssentialEnglishVocab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
